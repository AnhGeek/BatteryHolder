name: battery_holder
description: "ESP32 / ESP8266 battery monitoring and OTA flashing — Android port of the iOS app."
publish_to: 'none'

# The release workflow overrides both halves from the git tag it builds; this is
# what a local build gets. Keep it in step with the newest CHANGELOG entry.
version: 0.1.0+100

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State management: mirrors the iOS `@EnvironmentObject AppState` composition root.
  provider: ^6.1.2

  # Transports
  flutter_blue_plus: ^1.35.5      # CoreBluetooth equivalent
  nsd: ^3.0.0                     # Bonjour / mDNS browsing (NWBrowser equivalent)
  http: ^1.2.2                    # URLSession equivalent

  # Firmware handling
  crypto: ^3.0.6                  # SHA-256 verification of downloaded images
  file_picker: ^10.3.4             # .bin importer (fileImporter equivalent)
  permission_handler: ^11.3.1     # Android 12+ runtime Bluetooth permissions
  intl: ^0.20.2                   # Byte/number formatting

  # Beacon log persistence — the background scan service writes JSONL into the
  # app's files dir and the UI reads it back.
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/boards.json
    # Prebuilt firmware, staged by tools/build_firmware.py. The app ships these
    # images and pushes them to a board over USB; it never compiles anything.
    - assets/firmware/manifest.json
    - assets/firmware/esp32-wroom/
    - assets/firmware/esp32c3-devkit/
    - assets/firmware/esp8266-nodemcu/
    - assets/firmware/esp8266-d1mini/
