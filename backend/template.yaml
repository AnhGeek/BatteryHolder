AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BatteryHolder backend: firmware distribution + device fleet.
  S3 (artifacts) + DynamoDB (metadata, devices, telemetry) + Lambda + HTTP API
  + Cognito auth. Boards authenticate with a per-device token instead of a JWT.

Parameters:
  StageName:
    Type: String
    Default: prod
  PresignTtlSeconds:
    Type: Number
    Default: 300
    Description: Lifetime of presigned firmware download URLs.
  DefaultReportSeconds:
    Type: Number
    Default: 900
    Description: How long a Wi-Fi board deep sleeps between cloud check-ins.
  ReadingTtlDays:
    Type: Number
    Default: 30
    Description: How long telemetry history is kept before DynamoDB expires it.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures: [arm64]
    Environment:
      Variables:
        FIRMWARE_TABLE: !Ref FirmwareTable
        FIRMWARE_BUCKET: !Ref FirmwareBucket
        PRESIGN_TTL: !Ref PresignTtlSeconds
        DEFAULT_REPORT_SEC: !Ref DefaultReportSeconds
        READING_TTL_DAYS: !Ref ReadingTtlDays

Resources:

  FirmwareBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  FirmwareTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Devices by owner, for the app's device list.
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: batteryholder-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          RequireLowercase: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: batteryholder-ios
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  FirmwareApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      Auth:
        Authorizers:
          CognitoJWT:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoJWT
      CorsConfiguration:
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type, X-Device-Token]
        AllowOrigins: ['*']

  FirmwareFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FirmwareTable
        - S3CrudPolicy:
            BucketName: !Ref FirmwareBucket
      Events:
        ListForBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref FirmwareApi
            Method: GET
            Path: /boards/{boardId}/firmware
        GetDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref FirmwareApi
            Method: GET
            Path: /firmware/{buildId}
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref FirmwareApi
            Method: POST
            Path: /firmware
        ClaimDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref FirmwareApi
            Method: POST
            Path: /devices/claim
        ListDevices:
          Type: HttpApi
          Properties:
            ApiId: !Ref FirmwareApi
            Method: GET
            Path: /devices
        GetDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref FirmwareApi
            Method: GET
            Path: /devices/{deviceId}
        ReleaseDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref FirmwareApi
            Method: DELETE
            Path: /devices/{deviceId}
        QueueCommand:
          Type: HttpApi
          Properties:
            ApiId: !Ref FirmwareApi
            Method: POST
            Path: /devices/{deviceId}/commands
        # Boards have no user session: this route carries X-Device-Token and is
        # authorized inside the handler against the claimed device's token hash.
        Telemetry:
          Type: HttpApi
          Properties:
            ApiId: !Ref FirmwareApi
            Method: POST
            Path: /devices/{deviceId}/telemetry
            Auth:
              Authorizer: NONE

Outputs:
  ApiBaseUrl:
    Description: Base URL for the firmware API
    Value: !Sub https://${FirmwareApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  FirmwareBucketName:
    Value: !Ref FirmwareBucket
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
